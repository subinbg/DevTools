name: lazygit

on:
  push:
    branches: [main]
    tags: ['lazygit-*']
    paths:
      - 'tools/lazygit/**'
      - 'scripts/**'
      - '.github/workflows/lazygit.yml'
  pull_request:
    paths:
      - 'tools/lazygit/**'
      - 'scripts/**'
      - '.github/workflows/lazygit.yml'
  workflow_dispatch:

concurrency:
  group: lazygit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (linux x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/lazygit/src/go.mod
          cache-dependency-path: tools/lazygit/src/go.sum

      - name: Unit tests
        working-directory: tools/lazygit/src
        run: go test ./... -short

      - name: Build
        run: tools/lazygit/build.sh

      - name: Smoke test
        run: tools/lazygit/dist/lazygit --version

      - name: Package
        run: scripts/package.sh lazygit

      - uses: actions/upload-artifact@v7
        with:
          name: lazygit-linux-x64
          path: tools/lazygit/dist/lazygit-linux-x64*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/lazygit-')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: tools/lazygit/dist/lazygit-linux-x64*
