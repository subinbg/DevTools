name: zellij

on:
  push:
    branches: [main]
    tags: ['zellij-*']
    paths:
      - 'tools/zellij/**'
      - 'scripts/**'
      - '.github/workflows/zellij.yml'
  pull_request:
    paths:
      - 'tools/zellij/**'
      - 'scripts/**'
      - '.github/workflows/zellij.yml'
  workflow_dispatch:

concurrency:
  group: zellij-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (linux x64, musl)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain (from src/rust-toolchain.toml)
        working-directory: tools/zellij/src
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/zellij/src

      - name: Unit tests (fork crates)
        working-directory: tools/zellij/src
        run: cargo test --locked --no-default-features -p zellij-utils -p zellij-client -p zellij-server

      - name: Build
        run: tools/zellij/build.sh

      - name: Smoke test
        run: tools/zellij/dist/zellij --version

      - name: Package
        run: scripts/package.sh zellij

      - uses: actions/upload-artifact@v7
        with:
          name: zellij-linux-x64
          path: tools/zellij/dist/zellij-linux-x64*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/zellij-')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: tools/zellij/dist/zellij-linux-x64*
